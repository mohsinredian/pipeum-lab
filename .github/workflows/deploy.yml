name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    outputs:
      artifact_key: ${{ steps.pack.outputs.key }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, pdo_mysql, bcmath

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

      - name: Stamp version
        run: echo "${{ github.sha }}" > version.txt

      - name: Package
        id: pack
        run: |
          KEY="builds/${{ github.sha }}.tar.gz"
          tar --exclude-vcs --exclude='./node_modules' -czf app.tar.gz \
            app bootstrap config database public resources routes storage vendor \
            artisan composer.json composer.lock version.txt
          ls -lh app.tar.gz
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954015041558:role/GitHubActions-Staging-Deploy
          aws-region: ap-south-1

      - name: Upload artifact
        run: |
          aws s3 cp app.tar.gz "s3://securelab-artifacts/${{ steps.pack.outputs.key }}"
          echo "Uploaded: ${{ steps.pack.outputs.key }}"

      - name: Deploy to instance
        run: |
          INSTANCE_ID=i-084aea31c061f835d
          KEY="builds/${{ github.sha }}.tar.gz"
          RELEASE="${{ github.sha }}"

          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $RELEASE" \
            --parameters "commands=[
              'set -e',
              'aws s3 cp s3://securelab-artifacts/$KEY /tmp/app.tar.gz',
              'sudo mkdir -p /var/www/releases/$RELEASE',
              'sudo tar -xzf /tmp/app.tar.gz -C /var/www/releases/$RELEASE',
              'sudo chown -R www-data:www-data /var/www/releases/$RELEASE',
              'sudo chmod -R 775 /var/www/releases/$RELEASE/storage',
              'sudo ln -sfn /var/www/releases/$RELEASE /var/www/current',
              'sudo systemctl reload nginx',
              'cat /var/www/current/version.txt'
            ]" \
            --query 'Command.CommandId' --output text)

          echo "Command: $CMD"
          sleep 30

          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
