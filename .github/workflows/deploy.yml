name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, pdo_mysql, bcmath

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts

      - name: Stamp version
        run: echo "${{ github.sha }}" > version.txt

      - name: Package
        run: |
          tar --exclude-vcs --exclude='./node_modules' -czf app.tar.gz \
            app bootstrap config database public resources routes storage vendor \
            artisan composer.json composer.lock version.txt
          ls -lh app.tar.gz

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ap-south-1

      - name: Upload artifact if not present
        run: |
          KEY="builds/${{ github.sha }}.tar.gz"
          if aws s3api head-object --bucket securelab-artifacts --key "$KEY" 2>/dev/null; then
            echo "Artifact already exists — promoting the tested build"
          else
            aws s3 cp app.tar.gz "s3://securelab-artifacts/$KEY"
            echo "Uploaded new artifact"
          fi

      - name: Deploy
        run: |
          INSTANCE_ID=i-084aea31c061f835d
          KEY="builds/${{ github.sha }}.tar.gz"
          RELEASE="${{ github.sha }}"
          ROOT="${{ vars.DEPLOY_ROOT }}"
          ENV_NAME="${{ github.ref == 'refs/heads/main' && 'PRODUCTION' || 'STAGING' }}"

          echo "Deploying $RELEASE to $ENV_NAME"

          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $RELEASE" \
            --parameters "commands=[
              'set -e',
              'aws s3 cp s3://securelab-artifacts/$KEY /tmp/app.tar.gz',
              'sudo mkdir -p $ROOT/releases/$RELEASE',
              'sudo tar -xzf /tmp/app.tar.gz -C $ROOT/releases/$RELEASE',
              'sudo ln -sfn $ROOT/.env $ROOT/releases/$RELEASE/.env',
              'sudo chown -R www-data:www-data $ROOT/releases/$RELEASE',
              'sudo chmod -R 775 $ROOT/releases/$RELEASE/storage $ROOT/releases/$RELEASE/bootstrap/cache',
              'sudo ln -sfn $ROOT/releases/$RELEASE $ROOT/current',
              'cd $ROOT/current && sudo -u www-data php artisan config:clear',
              'sudo systemctl reload nginx',
              'cat $ROOT/current/version.txt'
            ]" \
            --query 'Command.CommandId' --output text)

          sleep 30
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
