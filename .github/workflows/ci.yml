name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, pdo_mysql, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/'            .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/'           .env
          sed -i 's|^APP_URL=.*|APP_URL=http://localhost|'   .env
          sed -i 's/^LOG_CHANNEL=.*/LOG_CHANNEL=stack/'      .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/'    .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^FILESYSTEM_DISK=.*/FILESYSTEM_DISK=local/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/'   .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/'          .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/'               .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=testing/'    .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/'       .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/'       .env
          cat .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate
        run: |
          for dir in terraform/environments/*/; do
            echo "=== $dir ==="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true
